name: Deploy Spring Boot Application

on:
  push:
    branches: [ dev, prod ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Set environment variables
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
          echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          echo "USE_DOCKER=false" >> $GITHUB_ENV
          echo "SPRING_PROFILE=prod" >> $GITHUB_ENV
          echo "LOG_SUFFIX=prod" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          echo "USE_DOCKER=true" >> $GITHUB_ENV
          echo "SPRING_PROFILE=dev" >> $GITHUB_ENV
          echo "LOG_SUFFIX=dev" >> $GITHUB_ENV
        fi
    
    - name: Stop existing application
      run: |
        pkill -f "java.*spring.profiles.active=${{ env.SPRING_PROFILE }}" || echo "No existing process found"
        sleep 5
    
    - name: Start MySQL container (dev only)
      if: env.USE_DOCKER == 'true'
      run: |
        docker compose down || docker-compose down || true
        docker compose up -d mysql || docker-compose up -d mysql
        echo "Waiting for MySQL to be ready..."
        timeout 60 bash -c 'until (docker compose exec -T mysql mysqladmin ping -h localhost --silent || docker-compose exec -T mysql mysqladmin ping -h localhost --silent); do sleep 2; done'
        echo "MySQL is ready!"
    
    - name: Create log directory (prod only)
      if: env.USE_DOCKER == 'false'
      run: |
        sudo mkdir -p /var/log/app
        sudo chown $USER:$USER /var/log/app
    
    - name: Build with Gradle
      run: |
        export GRADLE_OPTS="-Xmx1024m -XX:MaxMetaspaceSize=512m"
        ./gradlew clean build -x test --no-daemon --max-workers=2
        echo "Build completed!"
    
    - name: Start application (dev)
      if: env.USE_DOCKER == 'true'
      run: |
        # 환경변수 설정
        export SPRING_PROFILES_ACTIVE=dev
        export DB_HOST=localhost
        export DB_PORT=3306
        export DB_NAME=mj_dev
        export DB_USER=admin
        export DB_PASSWORD=devpassword
        export JWT_SECRET=WX1GYj5fM0dAWiE7PUE5JlV1UExyRTcqNF5xS35YVHNkUUp2TmZoY01Cb0lXMitMeCNDbjh5VnowSHdSdCVn
        export RANDOMMER_SECRET=b3dad28cde3e4ce1853a8c5bdc8438ab
        
        # JAR 파일 찾기
        JAR_FILE=$(find build/libs -name "*-SNAPSHOT.jar" ! -name "*-plain.jar" | head -1)
        JAR_FULL_PATH=$(realpath "$JAR_FILE")
        echo "Starting DEV JAR: $JAR_FULL_PATH"
        
        # 홈 디렉토리에서 실행하여 권한 문제 방지
        cd ~
        
        # disown을 사용하여 프로세스를 완전히 분리
        nohup java -jar \
          -Dspring.profiles.active=dev \
          -Xms256m -Xmx512m \
          "$JAR_FULL_PATH" > app-dev.log 2>&1 < /dev/null &
        
        JAVA_PID=$!
        disown $JAVA_PID
        echo "DEV application started with PID: $JAVA_PID"
        sleep 20
    
    - name: Start application (prod)
      if: env.USE_DOCKER == 'false'
      run: |
        export SPRING_PROFILES_ACTIVE=prod
        export DB_HOST="${{ secrets.DB_HOST }}"
        export DB_PORT="${{ secrets.DB_PORT }}"
        export DB_NAME="${{ secrets.DB_NAME }}"
        export DB_USER="${{ secrets.DB_USER }}"
        export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
        export JWT_SECRET="${{ secrets.JWT_SECRET }}"
        export RANDOMMER_SECRET="${{ secrets.RANDOMMER_SECRET }}"
        
        JAR_FILE=$(find build/libs -name "*-SNAPSHOT.jar" ! -name "*-plain.jar" | head -1)
        echo "Starting PROD JAR: $JAR_FILE"
        
        nohup java -jar \
          -Dspring.profiles.active=prod \
          -Xms512m -Xmx1024m \
          -XX:+UseG1GC \
          -XX:+UseStringDeduplication \
          "$JAR_FILE" > /dev/null 2>&1 &
        
        echo "PROD application started"
        sleep 20
    
    - name: Health check
      run: |
        for i in {1..12}; do
          if pgrep -f "java.*spring.profiles.active=${{ env.SPRING_PROFILE }}" > /dev/null; then
            echo "${{ env.ENVIRONMENT }} application is running!"
            exit 0
          fi
          echo "Waiting for application... ($i/12)"
          sleep 10
        done
        
        echo "Health check failed. Checking logs..."
        if [[ "${{ env.USE_DOCKER }}" == "true" ]]; then
          tail -n 50 app-dev.log
        else
          tail -n 50 /var/log/app/application.log
        fi
        exit 1
