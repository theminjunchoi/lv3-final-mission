name: Deploy Spring Boot Application

on:
  push:
    branches: [ dev, prod ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Set environment variables
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
          echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          echo "USE_DOCKER=false" >> $GITHUB_ENV
          echo "SPRING_PROFILE=prod" >> $GITHUB_ENV
          echo "LOG_SUFFIX=prod" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          echo "USE_DOCKER=true" >> $GITHUB_ENV
          echo "SPRING_PROFILE=dev" >> $GITHUB_ENV
          echo "LOG_SUFFIX=dev" >> $GITHUB_ENV
        fi
    
    - name: Stop existing application
      run: |
        pkill -f "java.*spring.profiles.active=${{ env.SPRING_PROFILE }}" || echo "No existing process found"
        sleep 5
    
    - name: Start MySQL container (dev only)
      if: env.USE_DOCKER == 'true'
      run: |
        # PATH에 docker-compose 추가
        export PATH=$PATH:/usr/local/bin:/usr/bin
        
        # Docker Compose 위치 찾기
        DOCKER_COMPOSE=""
        if [ -f /usr/local/bin/docker-compose ]; then
          DOCKER_COMPOSE="/usr/local/bin/docker-compose"
        elif [ -f /usr/bin/docker-compose ]; then
          DOCKER_COMPOSE="/usr/bin/docker-compose"
        elif command -v docker-compose >/dev/null; then
          DOCKER_COMPOSE="docker-compose"
        elif docker compose version >/dev/null 2>&1; then
          DOCKER_COMPOSE="docker compose"
        else
          echo "Docker Compose not found"
          exit 1
        fi
        
        echo "Using Docker Compose: $DOCKER_COMPOSE"
        
        # MySQL 컨테이너 시작
        if [[ "$DOCKER_COMPOSE" == "docker compose" ]]; then
          docker compose down || true
          docker compose up -d mysql
          timeout 60 bash -c 'until docker compose exec -T mysql mysqladmin ping -h localhost --silent; do sleep 2; done'
        else
          $DOCKER_COMPOSE down || true
          $DOCKER_COMPOSE up -d mysql
          timeout 60 bash -c "until $DOCKER_COMPOSE exec -T mysql mysqladmin ping -h localhost --silent; do sleep 2; done"
        fi
        
        echo "MySQL is ready!"
    
    - name: Create log directory (prod only)
      if: env.USE_DOCKER == 'false'
      run: |
        sudo mkdir -p /var/log/app
        sudo chown $USER:$USER /var/log/app
    
    - name: Build with Gradle
      run: |
        export GRADLE_OPTS="-Xmx1024m -XX:MaxMetaspaceSize=512m"
        ./gradlew clean build -x test --no-daemon --max-workers=2
        echo "Build completed!"
    
    - name: Start application (dev)
      if: env.USE_DOCKER == 'true'
      run: |
        # JAR 파일을 고정 위치로 복사
        JAR_FILE=$(find build/libs -name "*-SNAPSHOT.jar" ! -name "*-plain.jar" | head -1)
        cp "$JAR_FILE" ~/current-app.jar
        
        # systemd 서비스 파일이 있는지 확인하고 설치
        if [ ! -f /etc/systemd/system/spring-app-dev.service ]; then
          sudo cp spring-app-dev.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable spring-app-dev
        fi
        
        # JAR 경로 업데이트된 서비스 파일로 교체
        sudo sed -i 's|ExecStart=.*|ExecStart=/usr/bin/java -jar /home/ec2-user/current-app.jar|' /etc/systemd/system/spring-app-dev.service
        sudo systemctl daemon-reload
        
        # 서비스 재시작
        sudo systemctl restart spring-app-dev
        echo "DEV application started as systemd service"
        sleep 20
    
    - name: Start application (prod)
      if: env.USE_DOCKER == 'false'
      run: |
        export SPRING_PROFILES_ACTIVE=prod
        export DB_HOST="${{ secrets.DB_HOST }}"
        export DB_PORT="${{ secrets.DB_PORT }}"
        export DB_NAME="${{ secrets.DB_NAME }}"
        export DB_USER="${{ secrets.DB_USER }}"
        export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
        export JWT_SECRET="${{ secrets.JWT_SECRET }}"
        export RANDOMMER_SECRET="${{ secrets.RANDOMMER_SECRET }}"
        
        JAR_FILE=$(find build/libs -name "*-SNAPSHOT.jar" ! -name "*-plain.jar" | head -1)
        echo "Starting PROD JAR: $JAR_FILE"
        
        nohup java -jar \
          -Dspring.profiles.active=prod \
          -Xms512m -Xmx1024m \
          -XX:+UseG1GC \
          -XX:+UseStringDeduplication \
          "$JAR_FILE" > /dev/null 2>&1 &
        
        echo "PROD application started"
        sleep 20
    
    - name: Health check
      run: |
        for i in {1..12}; do
          if [[ "${{ env.USE_DOCKER }}" == "true" ]]; then
            # systemd 서비스 상태 확인
            if sudo systemctl is-active --quiet spring-app-dev; then
              echo "${{ env.ENVIRONMENT }} application is running via systemd!"
              exit 0
            fi
          else
            if pgrep -f "java.*spring.profiles.active=${{ env.SPRING_PROFILE }}" > /dev/null; then
              echo "${{ env.ENVIRONMENT }} application is running!"
              exit 0
            fi
          fi
          echo "Waiting for application... ($i/12)"
          sleep 10
        done
        
        echo "Health check failed. Checking logs..."
        if [[ "${{ env.USE_DOCKER }}" == "true" ]]; then
          sudo journalctl -u spring-app-dev --no-pager -n 50
        else
          tail -n 50 /var/log/app/application.log
        fi
        exit 1
