name: Deploy Spring Boot to Production EC2

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: self-hosted  # self-hosted runner
    
    steps:
    - name: Checkout prod branch
      uses: actions/checkout@v4
      with:
        ref: prod
    
    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Stop existing application
      run: |
        pkill -f "java.*spring.profiles.active=prod" || echo "No existing process found"
        sleep 5
    
    - name: Build with Gradle
      run: |
        export GRADLE_OPTS="-Xmx1024m -XX:MaxMetaspaceSize=512m"
        ./gradlew clean build -x test --no-daemon --max-workers=2
        echo "Build completed!"
    
    - name: Create log directory
      run: |
        sudo mkdir -p /var/log/app
        sudo chown $USER:$USER /var/log/app
    
    - name: Start application
      run: |
        # 환경변수는 GitHub Secrets로 관리
        export SPRING_PROFILES_ACTIVE=prod
        export DB_HOST="${{ secrets.DB_HOST }}"
        export DB_PORT="${{ secrets.DB_PORT }}"
        export DB_NAME="${{ secrets.DB_NAME }}"
        export DB_USER="${{ secrets.DB_USER }}"
        export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
        export JWT_SECRET="${{ secrets.JWT_SECRET }}"
        export RANDOMMER_SECRET="${{ secrets.RANDOMMER_SECRET }}"
        
        JAR_FILE=$(find build/libs -name "*-SNAPSHOT.jar" ! -name "*-plain.jar" | head -1)
        echo "Starting JAR: $JAR_FILE"
        
        # systemd 서비스로 실행하는 게 더 좋지만 일단 nohup으로
        nohup java -jar \
          -Dspring.profiles.active=prod \
          -Xms512m -Xmx1024m \
          -XX:+UseG1GC \
          -XX:+UseStringDeduplication \
          "$JAR_FILE" > /dev/null 2>&1 &
        
        echo "Production application started in background"
        sleep 20
    
    - name: Health check
      run: |
        # 프로세스가 살아있는지만 확인
        for i in {1..12}; do
          if pgrep -f "java.*spring.profiles.active=prod" > /dev/null; then
            echo "Production application is running!"
            exit 0
          fi
          echo "Waiting for application... ($i/12)"
          sleep 10
        done
        
        echo "Health check failed. Application logs:"
        tail -n 50 /var/log/app/application.log
        exit 1
